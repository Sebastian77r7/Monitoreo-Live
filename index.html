<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoreo en Vivo</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f5f5f5;
}

header{
    background:#198754;
    color:white;
    text-align:center;
    padding:30px;
}

.contenedor{
    width:90%;
    max-width:1000px;
    margin:20px auto;
}

.resumen{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:20px;
}

.tarjeta{
    flex:1;
    min-width:180px;
    background:white;
    padding:20px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.tarjeta h3{
    margin-top:0;
    color:#198754;
}

.numero{
    font-size:30px;
    font-weight:bold;
}

.clasificacion{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-bottom:20px;
}

.panel{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

button{
    background:#198754;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#146c43;
}

textarea{
    width:100%;
    min-height:250px;
    margin-top:15px;
    padding:10px;
    box-sizing:border-box;
    resize:vertical;
}

footer{
    margin-top:30px;
    background:#198754;
    color:white;
    text-align:center;
    padding:15px;
}

@media(max-width:600px){
    .clasificacion{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>Monitoreo en Vivo</h1>
    <p>Sistema de Monitoreo</p>
</header>

<div class="contenedor">

    <div class="resumen">

        <div class="tarjeta">
            <h3>Lote</h3>
            <div class="numero" id="lote">0 / 20</div>
        </div>

        <div class="tarjeta">
            <h3>Aprovechamiento</h3>
            <div class="numero" id="aprovechamiento">0%</div>
        </div>

        <div class="tarjeta">
            <h3>Estado</h3>
            <div class="numero" id="estado">En espera</div>
        </div>

    </div>

    <div class="clasificacion">

        <div class="tarjeta">
            <h3>🥫 Metal</h3>
            <div class="numero" id="metal">0</div>
        </div>

        <div class="tarjeta">
            <h3>♻️ Plástico</h3>
            <div class="numero" id="plastico">0</div>
        </div>

        <div class="tarjeta">
            <h3>🍾 Vidrio</h3>
            <div class="numero" id="vidrio">0</div>
        </div>

        <div class="tarjeta">
            <h3>🍃 Orgánico</h3>
            <div class="numero" id="organico">0</div>
        </div>

    </div>

    <div class="panel">

        <h2>Simulación del monitoreo</h2>

        <button onclick="simularCorrida()">
            Simular 20 objetos
        </button>

        <h2>Registro</h2>

        <textarea id="telemetria" readonly></textarea>

    </div>

</div>

<footer>
    Monitoreo en Vivo © 2026
</footer>

<script>
function simularCorrida(){

    let metal = 0;
    let plastico = 0;
    let vidrio = 0;
    let organico = 0;

    let registro = "";

    const residuos = [
        "Metal",
        "Plástico",
        "Vidrio",
        "Orgánico"
    ];

    document.getElementById("estado").textContent = "Procesando";

    for(let i=1; i<=20; i++){

        const residuo =
        residuos[Math.floor(Math.random()*residuos.length)];

        if(residuo==="Metal"){
            metal++;
            registro += "Objeto " + i + " → METAL\n";
        }

        if(residuo==="Plástico"){
            plastico++;
            registro += "Objeto " + i + " → PLÁSTICO\n";
        }

        if(residuo==="Vidrio"){
            vidrio++;
            registro += "Objeto " + i + " → VIDRIO\n";
        }

        if(residuo==="Orgánico"){
            organico++;
            registro += "Objeto " + i + " → ORGÁNICO\n";
        }
    }

    const total = metal + plastico + vidrio + organico;
    const porcentaje = (total/20)*100;

    document.getElementById("lote").textContent = total + " / 20";
    document.getElementById("metal").textContent = metal;
    document.getElementById("plastico").textContent = plastico;
    document.getElementById("vidrio").textContent = vidrio;
    document.getElementById("organico").textContent = organico;
    document.getElementById("aprovechamiento").textContent = porcentaje + "%";
    document.getElementById("estado").textContent = "Finalizado";

    document.getElementById("telemetria").value = registro;
}
</script>

</body>
</html>
