<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXEL RECYCLER - Arcade Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#10102a url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
    color:#fff;
    font-family:'Press Start 2P', cursive;
    padding:20px;
  }
 .machine{
    max-width:850px;
    margin:0 auto;
    background:#22223a;
    border:8px solid #fff;
    outline:4px solid #000;
    box-shadow: 0 0 0 8px #000, 15px 15px 0 #000;
    padding:20px;
  }
 .screen-top{
    background:#000;
    border:4px solid #555;
    padding:20px;
    text-align:center;
    margin-bottom:20px;
  }
 .screen-top h1{font-size:20px; color:#ffe600; text-shadow:4px 4px 0 #ff006a; line-height:1.5;}
 .screen-top p{font-size:8px; color:#00ff88; margin-top:15px; letter-spacing:1px;}

 .hud{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap:12px;
    margin-bottom:18px;
  }
 .hud-box{
    background:#000;
    border:3px solid #fff;
    padding:12px 8px;
    text-align:center;
  }
 .hud-box span{font-size:7px; display:block; margin-bottom:10px; color:#aaa;}
 .hud-box.numero{font-size:14px; color:#00ff88; text-shadow:0 0 5px #00ff88;}
  #estado{font-size:8px!important; color:#ffe600!important; line-height:1.6;}

 .inventory-title{font-size:9px; margin:15px 0 10px 0; color:#00e5ff;}
 .clasificacion{
    display:grid;
    grid-template-columns: repeat(4,1fr);
    gap:10px;
    margin-bottom:20px;
  }
 .item-card{
    background:#111;
    border:3px solid #444;
    padding:15px 5px;
    text-align:center;
  }
 .item-card h3{font-size:7px; margin-bottom:12px;}
 .item-card.numero{font-size:20px; color:#fff;}

 .control-panel{
    background:#000;
    border:4px dashed #ffe600;
    padding:18px;
  }
 .control-panel h2{font-size:10px; color:#ffe600; margin-bottom:15px;}
 .btn-arcade{
    background:#ff006a;
    color:#fff;
    border:0;
    border-bottom:6px solid #99003f;
    border-right:6px solid #99003f;
    padding:18px;
    width:100%;
    font-family:'Press Start 2P', cursive;
    font-size:11px;
    cursor:pointer;
  }
 .btn-arcade:active{
    border:0;
    transform:translate(6px,6px);
  }
 .btn-arcade:hover{background:#ff2a84;}

  #telemetria{
    width:100%;
    height:220px;
    margin-top:15px;
    background:#001a0e;
    color:#00ff88;
    border:3px solid #00ff88;
    padding:10px;
    font-family:monospace;
    font-size:14px;
    font-weight:bold;
  }
  footer{margin-top:20px; text-align:center; font-size:7px; color:#888;}

  @media(max-width:650px){
   .hud{grid-template-columns:1fr;}
   .clasificacion{grid-template-columns:1fr 1fr;}
   .screen-top h1{font-size:14px;}
  }
</style>
</head>
<body>

<div class="machine">
  <div class="screen-top">
    <h1>PIXEL RECYCLER</h1>
    <p>> INSERT COIN - SISTEMA DE MONITOREO <</p>
  </div>

  <div class="hud">
    <div class="hud-box">
      <span>LOTE</span>
      <div class="numero" id="lote">0 / 20</div>
    </div>
    <div class="hud-box">
      <span>APROVECHAMIENTO</span>
      <div class="numero" id="aprovechamiento">0%</div>
    </div>
    <div class="hud-box">
      <span>ESTADO</span>
      <div class="numero" id="estado">En espera</div>
    </div>
  </div>

  <div class="inventory-title">INVENTARIO:</div>
  <div class="clasificacion">
    <div class="item-card" style="border-color:#ffe600;">
      <h3 style="color:#ffe600;">METAL</h3>
      <div class="numero" id="metal">0</div>
    </div>
    <div class="item-card" style="border-color:#00e5ff;">
      <h3 style="color:#00e5ff;">PLASTICO</h3>
      <div class="numero" id="plastico">0</div>
    </div>
    <div class="item-card" style="border-color:#fff;">
      <h3 style="color:#fff;">VIDRIO</h3>
      <div class="numero" id="vidrio">0</div>
    </div>
    <div class="item-card" style="border-color:#00ff88;">
      <h3 style="color:#00ff88;">ORGANICO</h3>
      <div class="numero" id="organico">0</div>
    </div>
  </div>

  <div class="control-panel">
    <h2>CONSOLA - P1 START</h2>
    <button class="btn-arcade" onclick="simularCorrida()">[A] SIMULAR 20 OBJETOS</button>
    <textarea id="telemetria" readonly placeholder="> LOG VACIO... PRESIONA START"></textarea>
  </div>

  <footer>MONITOREO EN VIVO © 2026 - CREDIT 01</footer>
</div>

<script>
// FUNCION ORIGINAL - NO CAMBIA NADA DE LOGICA
function simularCorrida(){
    let metal = 0;
    let plastico = 0;
    let vidrio = 0;
    let organico = 0;
    let registro = "";
    const residuos = ["Metal","Plástico","Vidrio","Orgánico"];
    document.getElementById("estado").textContent = "PROCESANDO";
    for(let i=1; i<=20; i++){
        const residuo = residuos[Math.floor(Math.random()*residuos.length)];
        if(residuo==="Metal"){ metal++; registro += "OBJETO " + i + " → METAL\n"; }
        if(residuo==="Plástico"){ plastico++; registro += "OBJETO " + i + " → PLASTICO\n"; }
        if(residuo==="Vidrio"){ vidrio++; registro += "OBJETO " + i + " → VIDRIO\n"; }
        if(residuo==="Orgánico"){ organico++; registro += "OBJETO " + i + " → ORGANICO\n"; }
    }
    const total = metal + plastico + vidrio + organico;
    const porcentaje = (total/20)*100;
    document.getElementById("lote").textContent = total + " / 20";
    document.getElementById("metal").textContent = metal;
    document.getElementById("plastico").textContent = plastico;
    document.getElementById("vidrio").textContent = vidrio;
    document.getElementById("organico").textContent = organico;
    document.getElementById("aprovechamiento").textContent = porcentaje + "%";
    document.getElementById("estado").textContent = "FINALIZADO!";
    document.getElementById("telemetria").value = registro + "\n>> MISION COMPLETADA <<";
}
</script>
</body>
</html>
