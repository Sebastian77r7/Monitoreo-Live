<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>PIXEL RECYCLER QUEST</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0; background:#0d0d21; font-family:'Press Start 2P',cursive; color:#fff; padding:16px;}
  .cabinet{max-width:900px; margin:0 auto; background:#1a1a3a; border:6px solid #fff; box-shadow:10px 10px 0 #000; padding:16px;}
  header{text-align:center; background:#000; border:4px solid #00ff88; padding:20px; margin-bottom:16px;}
  header h1{font-size:18px; color:#00ff88; line-height:1.4; text-shadow:3px 3px 0 #000;}
  header p{font-size:8px; color:#00e5ff; margin-top:12px;}
  .label{font-size:8px; color:#ffe600; margin:18px 0 8px 0;}
  .resumen{display:flex; gap:10px; flex-wrap:wrap;}
  .box{flex:1; min-width:140px; background:#000; border:3px solid #fff; padding:12px; text-align:center;}
  .box span{font-size:7px; color:#aaa; display:block; margin-bottom:8px;}
  .numero{font-size:14px; color:#00ff88;}
  #estado{font-size:9px; color:#ffe600; line-height:1.5;}
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .card{background:#000; border:3px solid #333; padding:14px 5px; text-align:center;}
  .card h3{font-size:7px; margin:0 0 10px 0;}
  .card .numero{font-size:22px; color:#fff;}
  .panel{background:#000; border:4px solid #ffe600; padding:16px; margin-top:10px;}
  .panel h2{font-size:9px; color:#ffe600; margin:0 0 14px 0;}
  button{width:100%; background:#00ff88; color:#000; font-family:'Press Start 2P',cursive; font-size:11px; padding:16px; border:none; border-bottom:6px solid #009652; cursor:pointer;}
  button:active{transform:translateY(4px); border-bottom:2px solid #009652;}
  textarea{width:100%; height:240px; margin-top:14px; background:#020a05; color:#00ff88; border:3px solid #00ff88; padding:10px; font-family:monospace; font-size:14px; font-weight:bold;}
  footer{text-align:center; font-size:7px; color:#666; margin-top:16px;}
  @media(max-width:600px){.grid{grid-template-columns:1fr 1fr;} .resumen{flex-direction:column;} header h1{font-size:12px;}}
</style>
</head>
<body>
<div class="cabinet">
  <header>
    <h1>♻️ RECYCLE QUEST ♻️</h1>
    <p>> SISTEMA DE MONITOREO ARCADE v2.0_</p>
  </header>

  <div class="label">> PLAYER STATS</div>
  <div class="resumen">
    <div class="box"><span>LOTE</span><div class="numero" id="lote">0 / 20</div></div>
    <div class="box"><span>APROVECHAMIENTO</span><div class="numero" id="aprovechamiento">0%</div></div>
    <div class="box"><span>ESTADO</span><div class="numero" id="estado">En espera</div></div>
  </div>

  <div class="label">> MATERIALES RECOLECTADOS</div>
  <div class="grid">
    <div class="card" style="border-color:#ffe600"><h3 style="color:#ffe600">METAL</h3><div class="numero" id="metal">0</div></div>
    <div class="card" style="border-color:#00e5ff"><h3 style="color:#00e5ff">PLASTICO</h3><div class="numero" id="plastico">0</div></div>
    <div class="card" style="border-color:#ffffff"><h3 style="color:#fff">VIDRIO</h3><div class="numero" id="vidrio">0</div></div>
    <div class="card" style="border-color:#00ff88"><h3 style="color:#00ff88">ORGANICO</h3><div class="numero" id="organico">0</div></div>
  </div>

  <div class="panel">
    <h2>[!] PRESIONA START</h2>
    <button onclick="simularCorrida()">▶ SIMULAR 20 OBJETOS</button>
    <textarea id="telemetria" readonly placeholder="> LOG DEL SISTEMA..."></textarea>
  </div>

  <footer>MONITOREO EN VIVO © 2026 - PUSH START BUTTON</footer>
</div>

<script>
function simularCorrida(){
    let metal=0, plastico=0, vidrio=0, organico=0;
    let registro="";
    const residuos=["Metal","Plástico","Vidrio","Orgánico"];
    document.getElementById("estado").textContent="PROCESANDO...";
    for(let i=1;i<=20;i++){
        const r=residuos[Math.floor(Math.random()*residuos.length)];
        if(r==="Metal"){metal++; registro+="LVL "+i+" → METAL\n";}
        if(r==="Plástico"){plastico++; registro+="LVL "+i+" → PLASTICO\n";}
        if(r==="Vidrio"){vidrio++; registro+="LVL "+i+" → VIDRIO\n";}
        if(r==="Orgánico"){organico++; registro+="LVL "+i+" → ORGANICO\n";}
    }
    const total=metal+plastico+vidrio+organico;
    const porcentaje=(total/20)*100;
    document.getElementById("lote").textContent=total+" / 20";
    document.getElementById("metal").textContent=metal;
    document.getElementById("plastico").textContent=plastico;
    document.getElementById("vidrio").textContent=vidrio;
    document.getElementById("organico").textContent=organico;
    document.getElementById("aprovechamiento").textContent=porcentaje+"%";
    document.getElementById("estado").textContent="NIVEL COMPLETADO!";
    document.getElementById("telemetria").value=registro+"\n>> "+total+" OBJETOS - "+porcentaje+"% <<";
}
</script>
</body>
</html>
