<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXEL RECYCLER - RETRO COINS</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{
    margin:0; 
    background:#080810;
    background-image: radial-gradient(#1a1a2e 1px, transparent 1px);
    background-size:20px 20px;
    font-family:'Press Start 2P',cursive; 
    color:#fff; 
    padding:16px; 
    overflow-x:hidden;
  }
  /* Efecto CRT scanlines */
  body::before{
    content:""; position:fixed; top:0; left:0; right:0; bottom:0;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.25) 0px, transparent 2px, transparent 4px);
    pointer-events:none; z-index:10000;
  }
  .cabinet{
    max-width:900px; margin:0 auto; 
    background:#141428; 
    border:6px solid #00ff88; 
    box-shadow:0 0 20px rgba(0,255,136,0.4), 10px 10px 0 #000; 
    padding:18px; position:relative; z-index:2;
  }
  header{text-align:center; background:#000; border:4px dashed #ffe600; padding:22px; margin-bottom:18px;}
  header h1{font-size:18px; color:#ffe600; line-height:1.4; text-shadow:3px 3px 0 #ff006a, 0 0 10px #ffe600;}
  header p{font-size:8px; color:#00e5ff; margin-top:12px; letter-spacing:1px;}
  .label{font-size:8px; color:#00ff88; margin:20px 0 10px 0; text-shadow:0 0 5px #00ff88;}
  .resumen{display:flex; gap:12px; flex-wrap:wrap;}
  .box{flex:1; min-width:140px; background:#000; border:3px solid #fff; padding:14px; text-align:center; box-shadow:4px 4px 0 #000;}
  .box span{font-size:7px; color:#888; display:block; margin-bottom:10px;}
  .numero{font-size:15px; color:#00ff88; text-shadow:0 0 6px #00ff88;}
  #estado{font-size:9px; color:#ffe600!important; line-height:1.6; text-shadow:0 0 6px #ffe600;}
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  .card{background:#000; border:3px solid #444; padding:16px 5px; text-align:center; box-shadow:4px 4px 0 #000;}
  .card h3{font-size:7px; margin:0 0 12px 0; letter-spacing:1px;}
  .card .numero{font-size:24px; color:#fff; font-family:'VT323', monospace; text-shadow:none;}
  .panel{background:#000; border:4px solid #ff006a; box-shadow:0 0 15px rgba(255,0,106,0.3); padding:18px; margin-top:14px;}
  .panel h2{font-size:9px; color:#ff006a; margin:0 0 16px 0;}
  button{
    width:100%; background:#ffe600; color:#000; 
    font-family:'Press Start 2P',cursive; font-size:11px; 
    padding:18px; border:none; 
    border-bottom:6px solid #b3a300; border-right:6px solid #b3a300;
    cursor:pointer; box-shadow:0 0 12px rgba(255,230,0,0.5);
    transition:0.1s;
  }
  button:hover{background:#fff; box-shadow:0 0 20px #fff;}
  button:active{transform:translate(4px,4px); border:0;}
  textarea{
    width:100%; height:240px; margin-top:16px; 
    background:#000a05; color:#00ff88; 
    border:3px solid #00ff88; 
    box-shadow:inset 0 0 12px rgba(0,255,136,0.3);
    padding:12px; font-family:'VT323', monospace; font-size:20px; line-height:1.1;
  }
  footer{text-align:center; font-size:7px; color:#555; margin-top:18px;}

  /* MONEDAS - INTACTO Y ARREGLADO */
  #coin-layer{
    position:fixed; top:0; left:0; width:100vw; height:100vh;
    pointer-events:none; z-index:9999; overflow:hidden;
  }
  .coin{
    position:absolute; top:-50px; font-size:28px;
    animation: fall linear forwards; will-change: transform;
    filter: drop-shadow(0 0 6px #ffe600);
  }
  @keyframes fall{
    0%{transform:translateY(0) rotate(0deg);}
    100%{transform:translateY(110vh) rotate(720deg);}
  }
  @media(max-width:600px){.grid{grid-template-columns:1fr 1fr;} header h1{font-size:12px;}}
</style>
</head>
<body>

<div id="coin-layer"></div>

<div class="cabinet">
  <header>
    <h1>♻️ RECYCLE QUEST ♻️</h1>
    <p>>> COIN RAIN ARCADE v5 - INSERT COIN <<</p>
  </header>

  <div class="label">> PLAYER STATS</div>
  <div class="resumen">
    <div class="box"><span>LOTE</span><div class="numero" id="lote">0 / 20</div></div>
    <div class="box"><span>APROVECHAMIENTO</span><div class="numero" id="aprovechamiento">0%</div></div>
    <div class="box"><span>ESTADO</span><div class="numero" id="estado">En espera</div></div>
  </div>

  <div class="label">> INVENTARIO</div>
  <div class="grid">
    <div class="card" style="border-color:#ffe600"><h3 style="color:#ffe600">METAL</h3><div class="numero" id="metal">0</div></div>
    <div class="card" style="border-color:#00e5ff"><h3 style="color:#00e5ff">PLASTICO</h3><div class="numero" id="plastico">0</div></div>
    <div class="card" style="border-color:#fff"><h3 style="color:#fff">VIDRIO</h3><div class="numero" id="vidrio">0</div></div>
    <div class="card" style="border-color:#00ff88"><h3 style="color:#00ff88">ORGANICO</h3><div class="numero" id="organico">0</div></div>
  </div>

  <div class="panel">
    <h2>[!] P1 START</h2>
    <button onclick="simularCorrida()">▶ SIMULAR 20 OBJETOS</button>
    <textarea id="telemetria" readonly placeholder="> LOG DEL SISTEMA ARCADE..."></textarea>
  </div>

  <footer>MONITOREO EN VIVO © 2026 - CREDIT 01</footer>
</div>

<script>
function lanzarMonedas(n){
  const layer = document.getElementById("coin-layer");
  layer.innerHTML = "";
  for(let i=0;i<n;i++){
    const c = document.createElement("div");
    c.className = "coin";
    c.innerHTML = "🪙";
    c.style.left = (Math.random()*95) + "vw";
    c.style.animationDuration = (Math.random()*1 + 1.2) + "s";
    c.style.animationDelay = (Math.random()*0.5) + "s";
    c.style.fontSize = (20 + Math.random()*22) + "px";
    layer.appendChild(c);
  }
  setTimeout(()=>{ layer.innerHTML=""; }, 3500);
}

function simularCorrida(){
    lanzarMonedas(45);
    let metal=0, plastico=0, vidrio=0, organico=0;
    let registro="";
    const residuos=["Metal","Plástico","Vidrio","Orgánico"];
    document.getElementById("estado").textContent="PROCESANDO...";
    for(let i=1;i<=20;i++){
        const r=residuos[Math.floor(Math.random()*residuos.length)];
        if(r==="Metal"){metal++; registro+="OBJ "+i+" → METAL 🟡\n";}
        if(r==="Plástico"){plastico++; registro+="OBJ "+i+" → PLASTICO 🔵\n";}
        if(r==="Vidrio"){vidrio++; registro+="OBJ "+i+" → VIDRIO ⚪\n";}
        if(r==="Orgánico"){organico++; registro+="OBJ "+i+" → ORGANICO 🟢\n";}
    }
    const total=metal+plastico+vidrio+organico;
    const porcentaje=(total/20)*100;
    document.getElementById("lote").textContent=total+" / 20";
    document.getElementById("metal").textContent=metal;
    document.getElementById("plastico").textContent=plastico;
    document.getElementById("vidrio").textContent=vidrio;
    document.getElementById("organico").textContent=organico;
    document.getElementById("aprovechamiento").textContent=porcentaje+"%";
    document.getElementById("estado").textContent="¡NIVEL COMPLETADO!";
    document.getElementById("telemetria").value=registro+"\n>> BONUS +"+total+" COINS <<";
}
</script>
</body>
</html>
